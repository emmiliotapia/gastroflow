<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GastroFlow KDS • Monitor Digital de Cocina y Barra</title>
  
  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              500: '#f97316',
              600: '#ea580c',
            },
            accent: {
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'card': '0 4px 15px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
            'urgent': '0 0 20px -3px rgba(239, 68, 68, 0.35)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Barra de scroll horizontal limpia para comanderos KDS */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #e2e8f0;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden select-none">

  <!-- TOP BAR KDS -->
  <header class="bg-white border-b border-slate-200 px-6 py-3.5 flex justify-between items-center z-20 shadow-sm flex-shrink-0">
    
    <!-- Branding & Estación -->
    <div class="flex items-center gap-4">
      <a href="index.html" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center transition" title="Ir al Catálogo de Soluciones">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-orange-50 border border-orange-200 flex items-center justify-center text-brand-600">
          <i data-lucide="chef-hat" class="w-6 h-6"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-outfit font-black text-xl text-slate-900 tracking-tight leading-none">
              Gastro<span class="text-brand-500">KDS</span>
            </h1>
            <span class="text-[10px] font-mono font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              EN VIVO
            </span>
          </div>
          <p class="text-xs text-slate-500 font-medium mt-0.5">Pantalla de Comandas de Cocina & Barra</p>
        </div>
      </div>

      <!-- Selector de Estación (Cocina / Barra / Todos) -->
      <div class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl ml-4">
        <button onclick="setStation('ALL')" id="btn-st-ALL" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs transition">
          General
        </button>
        <button onclick="setStation('KITCHEN')" id="btn-st-KITCHEN" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          Cocina
        </button>
        <button onclick="setStation('BAR')" id="btn-st-BAR" class="px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          Barra
        </button>
      </div>
    </div>

    <!-- Filtros de Estado & Acciones -->
    <div class="flex items-center gap-3">
      
      <!-- Filtro de Estados -->
      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
        <button onclick="setFilter('ALL')" id="filter-all" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition">
          Todas (<span id="count-all">3</span>)
        </button>
        <button onclick="setFilter('PENDING')" id="filter-pending" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          En Cola (<span id="count-pending">1</span>)
        </button>
        <button onclick="setFilter('PREPARING')" id="filter-preparing" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          Cocinando (<span id="count-preparing">1</span>)
        </button>
        <button onclick="setFilter('READY')" id="filter-ready" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition">
          Listas (<span id="count-ready">1</span>)
        </button>
      </div>

      <!-- Nueva Comanda Demo -->
      <button onclick="injectDemoOrder()" class="px-3.5 py-2 rounded-xl bg-orange-50 hover:bg-orange-100 border border-orange-200 text-brand-700 text-xs font-bold flex items-center gap-1.5 transition active:scale-95">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">Nueva Orden Demo</span>
      </button>

      <!-- Botón de Audio Alerta -->
      <button onclick="toggleAudio()" id="btn-audio" class="p-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition" title="Alerta Sonora Activa">
        <i data-lucide="volume-2" class="w-4 h-4 text-emerald-600" id="audio-icon"></i>
      </button>

    </div>
  </header>

  <!-- TABLERO KDS HORIZONTAL CON COLA FIFO -->
  <main class="flex-1 p-6 overflow-x-auto overflow-y-hidden flex gap-5 items-stretch" id="kds-board">
    <!-- Se inyectan las tarjetas de comandas -->
  </main>

  <!-- FOOTER STATUS & RELOJ -->
  <footer class="bg-white border-t border-slate-200 px-6 py-2.5 flex justify-between items-center text-xs font-medium text-slate-500 z-20 flex-shrink-0">
    <div class="flex items-center gap-6">
      <span class="flex items-center gap-1.5 font-bold text-slate-700">
        <span class="w-2 h-2 rounded-full bg-slate-400"></span> 
        Total en Pantalla: <span id="stat-total" class="font-mono">3</span>
      </span>
      <span class="flex items-center gap-1.5 text-rose-600 font-semibold">
        <span class="w-2 h-2 rounded-full bg-rose-500"></span> 
        Alerta Demora (>15m): <span id="stat-delayed" class="font-mono">0</span>
      </span>
      <span class="flex items-center gap-1.5 text-emerald-600 font-semibold">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 
        FIFO Automático Ordenado
      </span>
    </div>

    <div class="flex items-center gap-4 text-xs font-mono">
      <span class="text-slate-400">Terminal KDS #1</span>
      <span id="clock-display" class="font-black text-slate-900 bg-slate-100 px-2 py-0.5 rounded">12:00:00</span>
    </div>
  </footer>

  <!-- SCRIPT KDS -->
  <script>
    let currentStation = 'ALL';
    let currentFilter = 'ALL';
    let audioEnabled = true;

    // Órdenes iniciales de demostración para restaurantes
    let orders = [
      {
        id: 'ORD-104',
        table: 'MESA 04',
        waiter: 'Carlos M.',
        station: 'KITCHEN',
        status: 'PREPARING', // PENDING, PREPARING, READY
        createdAt: Date.now() - (1000 * 60 * 8), // Hace 8 min (Ámbar)
        items: [
          { qty: 2, name: 'Hamburguesa Smash Trufada', notes: 'Término medio, sin cebolla en una' },
          { qty: 1, name: 'Papas Rústicas con Parmesano', notes: 'Salsa tártara extra' }
        ]
      },
      {
        id: 'ORD-105',
        table: 'TERRAZA 02',
        waiter: 'Ana R.',
        station: 'BAR',
        status: 'PENDING',
        createdAt: Date.now() - (1000 * 60 * 3), // Hace 3 min (Verde)
        items: [
          { qty: 2, name: 'Cóctel Gin Tonic Frutos Rojos', notes: 'Poco hielo' },
          { qty: 1, name: 'Cerveza Artesanal IPA 355ml', notes: 'Vaso escarchado' }
        ]
      },
      {
        id: 'ORD-103',
        table: 'MESA 09',
        waiter: 'Carlos M.',
        station: 'KITCHEN',
        status: 'READY',
        createdAt: Date.now() - (1000 * 60 * 14),
        items: [
          { qty: 1, name: 'Pizza Margherita Napolitana', notes: 'Bien dorada' },
          { qty: 1, name: 'Tacos de Rib Eye con Tuétano', notes: 'Salsa habanera aparte' }
        ]
      }
    ];

    // Cargar órdenes persistidas o usar las predeterminadas
    function initOrders() {
      const stored = localStorage.getItem('gastro_orders');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            orders = parsed;
            return;
          }
        } catch(e) {}
      }
      localStorage.setItem('gastro_orders', JSON.stringify(orders));
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initOrders();
      renderOrders();
      setInterval(updateClock, 1000);
      setInterval(renderOrders, 10000);

      // Escuchar comandas entrantes desde Menú QR o Comandero en vivo
      window.addEventListener('storage', (e) => {
        if (e.key === 'gastro_new_order_event' && e.newValue) {
          try {
            const newOrder = JSON.parse(e.newValue);
            if (!orders.some(o => o.id === newOrder.id)) {
              orders.unshift(newOrder);
              playBeep();
              renderOrders();
            }
          } catch(err) {}
        } else if (e.key === 'gastro_orders' && e.newValue) {
          try {
            orders = JSON.parse(e.newValue);
            renderOrders();
          } catch(err) {}
        }
      });
    });

    function saveOrders() {
      localStorage.setItem('gastro_orders', JSON.stringify(orders));
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0];
    }

    function setStation(station) {
      currentStation = station;
      ['ALL', 'KITCHEN', 'BAR'].forEach(s => {
        const btn = document.getElementById(`btn-st-${s}`);
        if (s === station) {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs transition';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderOrders();
    }

    function setFilter(filter) {
      currentFilter = filter;
      const filters = ['ALL', 'PENDING', 'PREPARING', 'READY'];
      filters.forEach(f => {
        const btn = document.getElementById(`filter-${f.toLowerCase()}`);
        if (f === filter) {
          btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-900 text-white transition';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderOrders();
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const icon = document.getElementById('audio-icon');
      if (audioEnabled) {
        icon.setAttribute('data-lucide', 'volume-2');
        icon.className = 'w-4 h-4 text-emerald-600';
      } else {
        icon.setAttribute('data-lucide', 'volume-x');
        icon.className = 'w-4 h-4 text-slate-400';
      }
      lucide.createIcons();
    }

    function playBeep() {
      if (!audioEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function getElapsedTime(timestamp) {
      const diffMins = Math.floor((Date.now() - timestamp) / 60000);
      return diffMins;
    }

    function renderOrders() {
      const board = document.getElementById('kds-board');
      board.innerHTML = '';

      // Filtrado
      let filtered = orders.filter(o => {
        const matchStation = currentStation === 'ALL' || o.station === currentStation;
        const matchStatus = currentFilter === 'ALL' || o.status === currentFilter;
        return matchStation && matchStatus;
      });

      // Conteo de badges
      document.getElementById('count-all').innerText = orders.length;
      document.getElementById('count-pending').innerText = orders.filter(o => o.status === 'PENDING').length;
      document.getElementById('count-preparing').innerText = orders.filter(o => o.status === 'PREPARING').length;
      document.getElementById('count-ready').innerText = orders.filter(o => o.status === 'READY').length;

      document.getElementById('stat-total').innerText = orders.length;
      document.getElementById('stat-delayed').innerText = orders.filter(o => getElapsedTime(o.createdAt) >= 15 && o.status !== 'READY').length;

      if (filtered.length === 0) {
        board.innerHTML = `
          <div class="m-auto flex flex-col items-center justify-center text-slate-400 py-16">
            <i data-lucide="check-circle-2" class="w-12 h-12 text-slate-300 mb-3"></i>
            <p class="font-outfit text-base font-bold text-slate-700">Sin comandas pendientes</p>
            <p class="text-xs text-slate-400">La estación se encuentra al día con los pedidos.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach(order => {
        const mins = getElapsedTime(order.createdAt);
        
        // Semáforo de tiempos
        let timerBg = 'bg-emerald-50 text-emerald-700 border-emerald-200';
        let cardBorder = 'border-slate-200';
        if (mins >= 8 && mins < 15) {
          timerBg = 'bg-amber-50 text-amber-700 border-amber-200';
          cardBorder = 'border-amber-300';
        } else if (mins >= 15) {
          timerBg = 'bg-rose-50 text-rose-700 border-rose-300 font-black animate-pulse';
          cardBorder = 'border-rose-400 shadow-urgent';
        }

        // Estado Badge
        let statusBadge = '';
        if (order.status === 'PENDING') {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-slate-100 text-slate-700 border border-slate-200">EN COLA</span>`;
        } else if (order.status === 'PREPARING') {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-amber-50 text-amber-700 border border-amber-200">COCINANDO</span>`;
        } else if (order.status === 'READY') {
          statusBadge = `<span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">LISTA</span>`;
        }

        // Acciones botón según estado
        let actionBtn = '';
        if (order.status === 'PENDING') {
          actionBtn = `
            <button onclick="advanceOrder('${order.id}', 'PREPARING')" class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs flex items-center justify-center gap-1.5 transition">
              <i data-lucide="flame" class="w-3.5 h-3.5 text-brand-400"></i>
              <span>Iniciar Preparación</span>
            </button>
          `;
        } else if (order.status === 'PREPARING') {
          actionBtn = `
            <button onclick="advanceOrder('${order.id}', 'READY')" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 transition">
              <i data-lucide="check" class="w-3.5 h-3.5"></i>
              <span>Marcar Listo para Entrega</span>
            </button>
          `;
        } else if (order.status === 'READY') {
          actionBtn = `
            <button onclick="finishOrder('${order.id}')" class="w-full py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs flex items-center justify-center gap-1.5 transition">
              <i data-lucide="archive" class="w-3.5 h-3.5"></i>
              <span>Archivar Comanda Despachada</span>
            </button>
          `;
        }

        const itemsHtml = order.items.map(it => `
          <div class="py-2 border-b border-slate-100 last:border-0">
            <div class="flex items-start gap-2.5">
              <span class="w-6 h-6 rounded-lg bg-slate-100 text-slate-800 font-mono font-bold text-xs flex items-center justify-center flex-shrink-0">
                ${it.qty}
              </span>
              <div class="flex-1">
                <p class="text-xs sm:text-sm font-bold text-slate-900 leading-snug">${it.name}</p>
                ${it.notes ? `<p class="text-[11px] font-medium text-amber-700 bg-amber-50 px-2 py-0.5 rounded mt-1 border border-amber-100">${it.notes}</p>` : ''}
              </div>
            </div>
          </div>
        `).join('');

        board.innerHTML += `
          <div class="w-80 flex-shrink-0 bg-white rounded-2xl border ${cardBorder} shadow-card flex flex-col justify-between overflow-hidden">
            
            <!-- Card Header -->
            <div class="p-4 bg-slate-50/70 border-b border-slate-100">
              <div class="flex justify-between items-start">
                <div>
                  <h3 class="font-outfit text-lg font-black text-slate-900 leading-tight">${order.table}</h3>
                  <div class="flex items-center gap-2 mt-0.5">
                    <span class="text-[11px] font-mono font-bold text-brand-600">${order.id}</span>
                    <span class="text-slate-300">•</span>
                    <span class="text-[11px] text-slate-500">${order.waiter}</span>
                  </div>
                </div>
                
                <div class="flex flex-col items-end gap-1">
                  <div class="px-2.5 py-1 rounded-lg border text-xs font-mono font-bold flex items-center gap-1 ${timerBg}">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                    <span>${mins} min</span>
                  </div>
                  ${statusBadge}
                </div>
              </div>
            </div>

            <!-- Card Body Items -->
            <div class="p-4 flex-1 overflow-y-auto max-h-[calc(100vh-270px)]">
              ${itemsHtml}
            </div>

            <!-- Card Actions -->
            <div class="p-3 bg-slate-50 border-t border-slate-100">
              ${actionBtn}
            </div>

          </div>
        `;
      });

      lucide.createIcons();
    }

    function advanceOrder(id, nextStatus) {
      const ord = orders.find(o => o.id === id);
      if (ord) {
        ord.status = nextStatus;
        playBeep();
        saveOrders();
        renderOrders();
      }
    }

    function finishOrder(id) {
      orders = orders.filter(o => o.id !== id);
      playBeep();
      saveOrders();
      renderOrders();
    }

    function injectDemoOrder() {
      const randomTables = ['MESA 01', 'MESA 05', 'TERRAZA 04', 'BARRA 02'];
      const randomProducts = [
        { qty: 1, name: 'Bacon Cheese Burger Clásica', notes: 'Papas bien doradas' },
        { qty: 2, name: 'Tacos de Rib Eye con Tuétano', notes: 'Con limón extra' },
        { qty: 1, name: 'Cóctel Gin Tonic Frutos Rojos', notes: 'Copa fría' }
      ];

      const newId = `ORD-${Math.floor(100 + Math.random() * 900)}`;
      orders.unshift({
        id: newId,
        table: randomTables[Math.floor(Math.random() * randomTables.length)],
        waiter: 'Mariana V.',
        station: 'KITCHEN',
        status: 'PENDING',
        createdAt: Date.now(),
        items: [randomProducts[Math.floor(Math.random() * randomProducts.length)]]
      });

      playBeep();
      saveOrders();
      renderOrders();
    }
  </script>
</body>
</html>
