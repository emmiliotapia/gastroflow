<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GastroFlow • Menú Digital & Pedidos QR</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Modern GastroNotify Library -->
  <script src="notifications.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c'
            },
            accent: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(15, 23, 42, 0.05), 0 2px 6px -1px rgba(15, 23, 42, 0.02)',
            'float': '0 20px 30px -10px rgba(249, 115, 22, 0.25)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none pb-28">

  <!-- TOP HEADER CON IDENTIFICADOR DE MESA -->
  <header class="bg-white/95 border-b border-slate-200/80 px-4 py-3 sticky top-0 z-30 backdrop-blur-md flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-xl bg-orange-50 border border-orange-200 text-brand-600 flex items-center justify-center hover:bg-orange-100 transition" title="Volver al Catálogo">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
      </a>
      <div>
        <h1 class="font-outfit text-base font-extrabold text-slate-900 tracking-tight leading-tight flex items-center gap-1.5">
          Gastro<span class="text-brand-500">Flow</span>
          <span class="text-[10px] font-mono font-bold px-1.5 py-0.2 rounded bg-orange-100 text-brand-700">QR</span>
        </h1>
        <p class="text-[10px] text-slate-500 font-medium">Carta & Pedidos en Mesa</p>
      </div>
    </div>

    <!-- Table Badge (Click to Change) -->
    <button onclick="promptChangeTable()" class="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 border border-slate-200 text-xs font-mono font-bold text-slate-800 flex items-center gap-1.5 transition active:scale-95">
      <i data-lucide="map-pin" class="w-3.5 h-3.5 text-brand-500"></i>
      <span id="header-table-badge">MESA: 04</span>
    </button>
  </header>

  <!-- QUICK ASSISTANCE BAR (LLAMAR MESERO / PEDIR CUENTA) -->
  <section class="max-w-4xl w-full mx-auto px-4 pt-3">
    <div class="bg-white rounded-2xl p-2.5 flex items-center justify-between gap-2 border border-slate-200/80 shadow-card">
      <div class="text-xs font-medium text-slate-600 pl-2 hidden sm:flex items-center gap-1.5">
        <i data-lucide="bell" class="w-3.5 h-3.5 text-brand-500"></i>
        <span>¿Necesitas ayuda del personal?</span>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <!-- Llamar Mesero -->
        <button onclick="callWaiter()" class="flex-1 sm:flex-none px-3.5 py-2 rounded-xl bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
          <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-brand-500"></i>
          <span>Llamar Mesero</span>
        </button>

        <!-- Solicitar la Cuenta -->
        <button onclick="requestBill()" class="flex-1 sm:flex-none px-3.5 py-2 rounded-xl bg-orange-50 hover:bg-orange-100 border border-orange-200 text-brand-700 text-xs font-bold flex items-center justify-center gap-1.5 transition active:scale-95">
          <i data-lucide="receipt" class="w-3.5 h-3.5 text-brand-500"></i>
          <span>Pedir la Cuenta</span>
        </button>
      </div>
    </div>
  </section>

  <!-- SEARCH & CATEGORIES -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col gap-4">
    
    <!-- Instant Search Bar -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
      <input type="text" id="client-search" oninput="renderClientMenu()" placeholder="Buscar hamburguesa, cóctel, postre, café..." class="w-full bg-white border border-slate-200 rounded-2xl py-3 pl-10 pr-4 text-xs sm:text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20 shadow-sm transition">
    </div>

    <!-- Category Pills -->
    <div id="category-pills" class="flex gap-2 overflow-x-auto pb-1 -mx-4 px-4 scrollbar-none">
      <!-- Dynamic Categories -->
    </div>

    <!-- Product Grid -->
    <div id="client-menu-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3.5 sm:gap-4">
      <!-- Dynamic Products -->
    </div>
  </main>

  <!-- STICKY CART FOOTER -->
  <footer id="sticky-cart-footer" class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 border-t border-slate-200 p-3.5 backdrop-blur-xl transition-all duration-300 transform translate-y-full shadow-2xl">
    <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Counter & Total Info -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-orange-50 border border-orange-200 flex items-center justify-center flex-shrink-0 text-brand-600 font-mono font-extrabold text-sm shadow-sm" id="cart-qty-badge">
          0
        </div>
        <div>
          <div class="text-[10px] text-slate-500 uppercase font-mono tracking-wider font-semibold">Total del Pedido</div>
          <div class="text-lg font-mono font-black text-slate-900 leading-tight" id="cart-total-display">$0.00</div>
        </div>
      </div>

      <!-- Submit Button -->
      <button onclick="openOrderModal()" class="py-3.5 px-6 rounded-2xl text-xs sm:text-sm font-extrabold uppercase tracking-wider text-white bg-brand-500 hover:bg-brand-600 shadow-float flex items-center justify-center gap-2 active:scale-95 transition">
        <i data-lucide="send" class="w-4 h-4"></i>
        <span>Enviar a Cocina</span>
      </button>
    </div>
  </footer>

  <!-- PRODUCT QUICK DETAIL / CUSTOMIZATION SHEET -->
  <div id="item-modal-overlay" onclick="closeItemModal()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 transition-opacity opacity-0 pointer-events-none"></div>
  
  <div id="item-modal" class="fixed bottom-0 left-0 right-0 max-w-lg mx-auto bg-white border-t border-slate-200 rounded-t-3xl z-50 p-6 shadow-2xl transform translate-y-full transition-transform duration-300 ease-out">
    <div class="flex justify-between items-start gap-3">
      <div>
        <span class="text-[10px] font-mono text-brand-700 font-bold px-2 py-0.5 rounded bg-orange-100 border border-orange-200" id="item-modal-cat">CATEGORÍA</span>
        <h3 class="font-outfit text-xl font-bold text-slate-900 mt-1.5" id="item-modal-name">Platillo Gourmet</h3>
      </div>
      <button onclick="closeItemModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>

    <!-- Product Image Preview -->
    <div id="item-modal-img-box" class="w-full h-36 bg-slate-100 rounded-2xl my-3.5 overflow-hidden border border-slate-200 flex items-center justify-center">
      <img id="item-modal-img" src="" alt="Foto" class="w-full h-full object-cover hidden">
      <div id="item-modal-img-placeholder" class="text-slate-400 flex flex-col items-center gap-1">
        <i data-lucide="utensils" class="w-8 h-8 text-brand-400"></i>
      </div>
    </div>

    <p class="text-xs text-slate-600 line-clamp-2" id="item-modal-desc">Descripción del platillo...</p>

    <!-- Quantity & Custom Notes -->
    <div class="mt-4 pt-3 border-t border-slate-100 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold text-slate-700">Porciones:</span>
        <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
          <button onclick="adjustItemModalQty(-1)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold flex items-center justify-center active:scale-95 shadow-xs">-</button>
          <span class="font-mono text-base font-bold text-slate-900 w-6 text-center" id="item-modal-qty">1</span>
          <button onclick="adjustItemModalQty(1)" class="w-8 h-8 rounded-lg bg-white border border-slate-200 text-slate-700 font-bold flex items-center justify-center active:scale-95 shadow-xs">+</button>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-semibold text-slate-600 mb-1">Instrucciones Especiales para Cocina:</label>
        <input type="text" id="item-modal-notes" placeholder="Ej. Sin cebolla, término medio, aderezo aparte..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-brand-500">
      </div>

      <button onclick="confirmAddItemToCart()" class="w-full py-3.5 rounded-xl text-xs font-bold uppercase tracking-wider text-white bg-brand-500 hover:bg-brand-600 shadow-float flex items-center justify-center gap-2 mt-2 transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i>
        <span id="item-modal-btn-text">Agregar • $0.00</span>
      </button>
    </div>
  </div>

  <!-- ORDER CONFIRMATION MODAL -->
  <div id="order-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white p-6 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto flex flex-col justify-between gap-4 border border-slate-200 shadow-2xl">
      
      <div>
        <!-- Modal Header -->
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <div>
            <h3 class="font-outfit text-lg font-bold text-slate-900 flex items-center gap-2">
              <i data-lucide="shopping-bag" class="w-5 h-5 text-brand-500"></i> Confirmar Comanda
            </h3>
            <span class="text-xs font-mono text-brand-600 font-bold" id="confirm-modal-table">Entrega en: MESA 04</span>
          </div>
          <button onclick="closeOrderModal()" class="text-slate-400 hover:text-slate-700 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <!-- Items Breakdown -->
        <div id="confirm-items-list" class="divide-y divide-slate-100 max-h-60 overflow-y-auto my-3 pr-1">
          <!-- Items will be injected -->
        </div>

        <!-- Total summary -->
        <div class="pt-3 border-t border-slate-100 space-y-1.5">
          <div class="flex justify-between text-xs text-slate-500">
            <span>Subtotal:</span>
            <span class="font-mono text-slate-700 font-semibold" id="confirm-subtotal">$0.00</span>
          </div>
          <div class="flex justify-between text-xs text-slate-500">
            <span>Impuestos (IVA incl.):</span>
            <span class="font-mono text-slate-700 font-semibold">$0.00</span>
          </div>
          <div class="flex justify-between text-base font-bold text-slate-900 pt-1 border-t border-slate-100">
            <span>Total a Pagar:</span>
            <span class="font-mono text-brand-600 text-lg" id="confirm-total">$0.00</span>
          </div>
        </div>
      </div>

      <div class="space-y-2 pt-2">
        <button onclick="submitOrderToKitchen()" id="btn-submit-order" class="w-full py-3.5 rounded-xl text-xs font-bold uppercase tracking-wider text-white bg-brand-500 hover:bg-brand-600 shadow-float flex items-center justify-center gap-2 transition">
          <i data-lucide="chef-hat" class="w-4 h-4"></i>
          <span>Enviar Comanda a Cocina</span>
        </button>
        <button onclick="closeOrderModal()" class="w-full py-2.5 rounded-xl text-xs font-bold text-slate-500 hover:text-slate-700 bg-slate-50">
          Seguir Ordenando
        </button>
      </div>

    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    const proto = window.location.protocol === 'https:' ? 'https:' : 'http:';
    const API_BASE = window.location.port === '8001' || window.location.port === '8000' ? '' : `${proto}//${window.location.host}`;

    let clientTable = '04';
    let clientCatalog = [];
    let selectedCategory = 'ALL';
    let clientCart = [];

    let activeModalProduct = null;
    let modalQty = 1;

    // Catálogo mock de gastronomía en caso de correr standalone
    const DEFAULT_RESTAURANT_CATALOG = [
      { id: '1', sku: 'HAM-01', name: 'Hamburguesa Smash Trufada', category: 'Hamburguesas & Grill', price: 185, destination_kds: 'KITCHEN', is_active: true, description: 'Doble carne angus 180g, queso cheddar madurado, mayo trufa y brioche artesanal.' },
      { id: '2', sku: 'HAM-02', name: 'Bacon Cheese Burger Clásica', category: 'Hamburguesas & Grill', price: 160, destination_kds: 'KITCHEN', is_active: true, description: 'Tocino ahumado crujiente, cebolla caramelizada y salsa especial de la casa.' },
      { id: '3', sku: 'PIZ-01', name: 'Pizza Margherita Napolitana', category: 'Pizzas & Pastas', price: 210, destination_kds: 'KITCHEN', is_active: true, description: 'Masa madre 48h, salsa pomodoro San Marzano, mozzarella fior di latte y albahaca fresca.' },
      { id: '4', sku: 'ENT-01', name: 'Papas Rústicas con Parmesano', category: 'Entradas & Tapas', price: 95, destination_kds: 'KITCHEN', is_active: true, description: 'Papas cortadas a mano con romero, aceite de trufa y lluvia de parmesano reggiano.' },
      { id: '5', sku: 'ENT-02', name: 'Tacos de Rib Eye con Tuétano', category: 'Entradas & Tapas', price: 175, destination_kds: 'KITCHEN', is_active: true, description: '3 tacos en tortilla de maíz azul, costra de queso gouda y tuétano tatemado.' },
      { id: '6', sku: 'BEB-01', name: 'Cóctel Gin Tonic Frutos Rojos', category: 'Coctelería & Bar', price: 140, destination_kds: 'BAR', is_active: true, description: 'Ginebra infusionada con frutos del bosque, agua tónica premium y rodaja de pomelo.' },
      { id: '7', sku: 'BEB-02', name: 'Cerveza Artesanal IPA 355ml', category: 'Coctelería & Bar', price: 85, destination_kds: 'BAR', is_active: true, description: 'Notas cítricas y resinosas con un amargor balanceado y refrescante.' },
      { id: '8', sku: 'CAF-01', name: 'Café Espresso Doble de Chiapas', category: 'Cafetería & Postres', price: 55, destination_kds: 'BAR', is_active: true, description: 'Grano de especialidad tostado localmente con notas de chocolate y avellana.' }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      initTableFromURL();
      loadCatalog();
    });

    function initTableFromURL() {
      const params = new URLSearchParams(window.location.search);
      const tableParam = params.get('table') || params.get('mesa') || params.get('m') || params.get('slot');
      
      if (tableParam && tableParam.trim()) {
        clientTable = tableParam.trim().toUpperCase();
        localStorage.setItem('restaurant_client_table', clientTable);
      } else {
        clientTable = localStorage.getItem('restaurant_client_table') || '04';
      }
      updateTableBadge();
    }

    function updateTableBadge() {
      document.getElementById('header-table-badge').innerText = `MESA: ${clientTable}`;
      document.getElementById('confirm-modal-table').innerText = `Entrega en: MESA ${clientTable}`;
    }

    async function promptChangeTable() {
      const nuevo = await GastroNotify.prompt("Ingresa el número de tu mesa o terraza:", clientTable, "Cambiar Mesa");
      if (nuevo && nuevo.trim()) {
        clientTable = nuevo.trim().toUpperCase();
        localStorage.setItem('restaurant_client_table', clientTable);
        updateTableBadge();
        GastroNotify.show({
          title: "Mesa Actualizada",
          message: `Tus próximos pedidos se entregarán en MESA ${clientTable}.`,
          type: "success"
        });
      }
    }

    async function loadCatalog() {
      try {
        const res = await fetch(`${API_BASE}/api/v1/products`);
        if (res.ok) {
          const data = await res.json();
          clientCatalog = data.length > 0 ? data : DEFAULT_RESTAURANT_CATALOG;
        } else {
          clientCatalog = DEFAULT_RESTAURANT_CATALOG;
        }
      } catch (e) {
        clientCatalog = DEFAULT_RESTAURANT_CATALOG;
      }

      // Render Categories
      const categories = ['ALL', ...new Set(clientCatalog.map(p => p.category))];
      const catContainer = document.getElementById('category-pills');
      catContainer.innerHTML = '';

      categories.forEach(c => {
        catContainer.innerHTML += `
          <button onclick="selectCategory('${c}')" id="client-cat-btn-${c}" class="px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${c === 'ALL' ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-600 hover:text-slate-900 border border-slate-200'}">
            ${c === 'ALL' ? 'Toda la Carta' : c}
          </button>
        `;
      });

      renderClientMenu();
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      const categories = ['ALL', ...new Set(clientCatalog.map(p => p.category))];
      categories.forEach(c => {
        const btn = document.getElementById(`client-cat-btn-${c}`);
        if (btn) {
          if (c === cat) {
            btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-slate-900 text-white whitespace-nowrap transition shadow-sm';
          } else {
            btn.className = 'px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 hover:text-slate-900 border border-slate-200 whitespace-nowrap transition';
          }
        }
      });
      renderClientMenu();
    }

    function renderClientMenu() {
      const query = document.getElementById('client-search').value.toLowerCase().trim();
      const container = document.getElementById('client-menu-grid');
      container.innerHTML = '';

      const filtered = clientCatalog.filter(p => {
        const matchCat = selectedCategory === 'ALL' || p.category === selectedCategory;
        const matchQuery = p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
        return matchCat && matchQuery && p.is_active;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-span-3 text-center py-16 text-xs text-slate-400 italic">No hay platillos disponibles en esta categoría</div>';
        return;
      }

      filtered.forEach(p => {
        const price = parseFloat(p.price || 0);
        const iconName = p.destination_kds === 'BAR' ? 'wine' : 'utensils';

        const imageHtml = p.image_url ? `
          <div class="w-full h-28 sm:h-36 bg-slate-100 rounded-xl mb-3 overflow-hidden border border-slate-200/60">
            <img src="${p.image_url}" alt="${p.name}" class="w-full h-full object-cover">
          </div>
        ` : `
          <div class="w-full h-28 sm:h-36 bg-slate-100 rounded-xl mb-3 flex items-center justify-center border border-slate-200/60 text-slate-400 group-hover:text-brand-500 transition">
            <i data-lucide="${iconName}" class="w-8 h-8"></i>
          </div>
        `;

        container.innerHTML += `
          <button type="button" onclick="openItemModal('${p.id}')" class="bg-white hover:bg-slate-50/80 p-3.5 rounded-2xl border border-slate-200/90 text-left flex flex-col justify-between transition group shadow-card active:scale-98">
            <div>
              ${imageHtml}
              <div class="text-[9px] font-mono font-bold text-brand-600 uppercase tracking-wider">${p.category}</div>
              <h4 class="text-xs sm:text-sm font-bold text-slate-900 group-hover:text-brand-600 transition mt-0.5 line-clamp-1 leading-tight">${p.name}</h4>
              <p class="text-[11px] text-slate-500 mt-1 line-clamp-2 leading-relaxed">${p.description || 'Preparado fresco al momento.'}</p>
            </div>

            <div class="mt-3 pt-2.5 border-t border-slate-100 flex justify-between items-center">
              <span class="text-xs sm:text-sm font-mono font-black text-slate-900">$${price.toFixed(2)}</span>
              <div class="w-7 h-7 rounded-xl bg-orange-50 border border-orange-200 flex items-center justify-center text-brand-600 group-hover:bg-brand-500 group-hover:text-white transition">
                <i data-lucide="plus" class="w-4 h-4"></i>
              </div>
            </div>
          </button>
        `;
      });
      lucide.createIcons();
    }

    function openItemModal(productId) {
      const prod = clientCatalog.find(p => p.id === productId);
      if (!prod) return;

      activeModalProduct = prod;
      modalQty = 1;

      document.getElementById('item-modal-cat').innerText = prod.category;
      document.getElementById('item-modal-name').innerText = prod.name;
      document.getElementById('item-modal-desc').innerText = prod.description || 'Preparación en tiempo real para servicio en mesa.';
      document.getElementById('item-modal-notes').value = '';
      document.getElementById('item-modal-qty').innerText = modalQty;

      const modalImg = document.getElementById('item-modal-img');
      const placeholder = document.getElementById('item-modal-img-placeholder');
      if (prod.image_url) {
        modalImg.src = prod.image_url;
        modalImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        modalImg.src = '';
        modalImg.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }

      updateItemModalButton();

      const modal = document.getElementById('item-modal');
      const overlay = document.getElementById('item-modal-overlay');
      overlay.classList.remove('pointer-events-none', 'opacity-0');
      overlay.classList.add('opacity-100');
      modal.classList.remove('translate-y-full');
    }

    function closeItemModal() {
      const modal = document.getElementById('item-modal');
      const overlay = document.getElementById('item-modal-overlay');
      overlay.classList.remove('opacity-100');
      overlay.classList.add('opacity-0', 'pointer-events-none');
      modal.classList.add('translate-y-full');
      activeModalProduct = null;
    }

    function adjustItemModalQty(delta) {
      modalQty += delta;
      if (modalQty < 1) modalQty = 1;
      document.getElementById('item-modal-qty').innerText = modalQty;
      updateItemModalButton();
    }

    function updateItemModalButton() {
      if (!activeModalProduct) return;
      const total = activeModalProduct.price * modalQty;
      document.getElementById('item-modal-btn-text').innerText = `Agregar • $${total.toFixed(2)}`;
    }

    function confirmAddItemToCart() {
      if (!activeModalProduct) return;
      const notes = document.getElementById('item-modal-notes').value.trim();

      const existing = clientCart.find(i => i.product.id === activeModalProduct.id && i.notes === notes);
      if (existing) {
        existing.quantity += modalQty;
      } else {
        clientCart.push({
          product: activeModalProduct,
          quantity: modalQty,
          notes: notes
        });
      }

      closeItemModal();
      updateCartUI();
    }

    function updateCartUI() {
      const footer = document.getElementById('sticky-cart-footer');
      const totalQty = clientCart.reduce((sum, item) => sum + item.quantity, 0);
      const totalAmount = clientCart.reduce((sum, item) => sum + (item.product.price * item.quantity), 0);

      document.getElementById('cart-qty-badge').innerText = totalQty;
      document.getElementById('cart-total-display').innerText = `$${totalAmount.toFixed(2)}`;

      if (totalQty > 0) {
        footer.classList.remove('translate-y-full');
      } else {
        footer.classList.add('translate-y-full');
      }
    }

    function openOrderModal() {
      const list = document.getElementById('confirm-items-list');
      list.innerHTML = '';

      let total = 0;
      clientCart.forEach((item, index) => {
        const itemTotal = item.product.price * item.quantity;
        total += itemTotal;

        list.innerHTML += `
          <div class="py-2.5 flex items-center justify-between text-xs">
            <div>
              <div class="font-bold text-slate-800">${item.quantity}x ${item.product.name}</div>
              ${item.notes ? `<div class="text-[10px] text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded mt-0.5 font-medium">Nota: ${item.notes}</div>` : ''}
            </div>
            <div class="flex items-center gap-3">
              <span class="font-mono font-bold text-slate-900">$${itemTotal.toFixed(2)}</span>
              <button onclick="removeCartItem(${index})" class="text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>
        `;
      });

      document.getElementById('confirm-subtotal').innerText = `$${total.toFixed(2)}`;
      document.getElementById('confirm-total').innerText = `$${total.toFixed(2)}`;

      document.getElementById('order-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeOrderModal() {
      document.getElementById('order-modal').classList.add('hidden');
    }

    function removeCartItem(index) {
      clientCart.splice(index, 1);
      updateCartUI();
      if (clientCart.length === 0) {
        closeOrderModal();
      } else {
        openOrderModal();
      }
    }

    async function submitOrderToKitchen() {
      const btn = document.getElementById('btn-submit-order');
      btn.disabled = true;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i><span>Enviando Comanda...</span>`;
      lucide.createIcons();

      const newOrderId = `ORD-${Math.floor(100 + Math.random() * 900)}`;
      const orderData = {
        id: newOrderId,
        table: `MESA ${clientTable}`,
        waiter: 'Autopedido QR',
        station: clientCart.some(i => i.product.destination_kds === 'BAR') ? 'BAR' : 'KITCHEN',
        status: 'PENDING',
        createdAt: Date.now(),
        items: clientCart.map(i => ({
          qty: i.quantity,
          name: i.product.name,
          price: i.product.price,
          notes: i.notes || ''
        }))
      };

      // 1. Guardar en bus local sincronizado en vivo (localStorage & evento de ventana)
      try {
        const stored = JSON.parse(localStorage.getItem('gastro_orders') || '[]');
        stored.unshift(orderData);
        localStorage.setItem('gastro_orders', JSON.stringify(stored));
        localStorage.setItem('gastro_new_order_event', JSON.stringify(orderData));
      } catch (e) {}

      // 2. Intentar backend API si está corriendo
      try {
        const payload = {
          machine_code: clientTable,
          notes: clientCart.map(i => i.notes).filter(Boolean).join(" | ") || "Comanda desde Menú QR",
          items: clientCart.map(item => ({
            product_id: (item.product.id && item.product.id.length > 20) ? item.product.id : "430bb253-e7a9-429a-9cc7-21e75a188e71",
            quantity: item.quantity,
            is_courtesy: false
          }))
        };
        await fetch(`${API_BASE}/api/v1/pos/order`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => null);
      } catch (err) {}

      // 3. Respaldo directo a ntfy prestige-kds (para garantizar aviso instantáneo a cocina)
      try {
        fetch(`https://ntfy.smartopsia.com/prestige-kds`, {
          method: 'POST',
          headers: {
            'Title': `🔥 Comanda QR #${newOrderId} (Mesa ${clientTable})`,
            'Priority': 'urgent',
            'Tags': 'rotating_light,fire,cooking',
            'Click': `${window.location.origin}/kds`
          },
          body: `${clientCart.map(i => `${i.quantity}x ${i.product.name}`).join(', ')}\nUbicación: Mesa ${clientTable}`
        }).catch(() => null);
      } catch (e) {}

      // 4. Notificación visual moderna en pantalla
      GastroNotify.modal({
        title: "¡Comanda Enviada a Cocina!",
        message: `Orden #${newOrderId} registrada con éxito.\nSe está preparando para entrega en MESA ${clientTable}.`,
        type: "order",
        icon: "chef-hat",
        confirmText: "Ver Estado"
      });

      GastroNotify.show({
        title: `Comanda #${newOrderId}`,
        message: "Enviada en tiempo real a Cocina y Barra (KDS)",
        type: "order",
        duration: 5000
      });

      clientCart = [];
      updateCartUI();
      closeOrderModal();

      btn.disabled = false;
      btn.innerHTML = `<i data-lucide="chef-hat" class="w-4 h-4"></i><span>Enviar Comanda a Cocina</span>`;
      lucide.createIcons();
    }

    function callWaiter() {
      try {
        fetch(`https://ntfy.smartopsia.com/prestige-meseros`, {
          method: 'POST',
          headers: {
            'Title': `🛎️ Mesa ${clientTable} solicita asistencia`,
            'Priority': 'urgent',
            'Tags': 'bell,waiter'
          },
          body: `El comensal en Mesa ${clientTable} solicita un mesero en sala.`
        }).catch(() => null);
      } catch (e) {}

      GastroNotify.modal({
        title: "¡Mesero Notificado!",
        message: `Hemos enviado una alerta prioritaria a los meseros de sala.\nUn compañero se acercará de inmediato a la Mesa ${clientTable}.`,
        type: "bell",
        icon: "bell-ring",
        confirmText: "Gracias"
      });
    }

    async function requestBill() {
      try {
        fetch(`https://ntfy.smartopsia.com/prestige-meseros`, {
          method: 'POST',
          headers: {
            'Title': `🧾 Mesa ${clientTable} pide la cuenta`,
            'Priority': 'high',
            'Tags': 'receipt,credit_card'
          },
          body: `El comensal en Mesa ${clientTable} ha solicitado su cuenta final.`
        }).catch(() => null);
      } catch (e) {}

      const method = await GastroNotify.modal({
        title: "¿Cómo deseas pagar?",
        message: `Solicitud de cuenta generada para la Mesa ${clientTable}.\nEl mesero llevará la cuenta a tu mesa en unos momentos.`,
        type: "order",
        icon: "credit-card",
        confirmText: "Efectivo / Tarjeta",
        cancelText: "Cerrar"
      });

      if (method) {
        GastroNotify.show({
          title: "Cuenta Solicitada",
          message: `El mesero se dirige a la Mesa ${clientTable}.`,
          type: "success"
        });
      }
    }
  </script>
</body>
