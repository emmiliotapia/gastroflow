version: '3.8'

services:
  # Servidor de Base de Datos PostgreSQL con soporte nativo de pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: casino_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casino_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casino_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-casino_erp_db}
    volumes:
      - pgdata_casino:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql
    ports:
      # Puerto 5433 en el VPS host mapeado al 5432 interno para evitar colisiones con otras DBs
      - "${POSTGRES_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casino_admin} -d ${POSTGRES_DB:-casino_erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - casino_net

  # API Principal FastAPI - Core Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: casino_backend
    restart: always
    env_file:
      - .env
    ports:
      # Puerto 8001 en el VPS host mapeado al 8000 interno del contenedor
      - "${BACKEND_PORT_HOST:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend
      - ./backend:/app/backend
      - ./uploads:/app/uploads
    networks:
      - casino_net

  # Servidor Privado de Notificaciones Push (ntfy.sh autoalojado)
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: casino_ntfy
    restart: always
    command:
      - serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-https://ntfy.smartopsia.com}
      - NTFY_BEHIND_PROXY=true
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_AUTH_FILE=/var/cache/ntfy/user.db
      - NTFY_AUTH_DEFAULT_ACCESS=${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
      - NTFY_ENABLE_LOGIN=true
    volumes:
      - ./docker/ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_cache:/var/cache/ntfy
      - ntfy_config:/etc/ntfy
    ports:
      # Puerto 8080 en el VPS host para Nginx Proxy Manager (ntfy.smartopsia.com)
      - "${NTFY_PORT_HOST:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -q '\"healthy\":true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - casino_net

volumes:
  pgdata_casino:
    driver: local
  ntfy_cache:
    driver: local
  ntfy_config:
    driver: local

networks:
  casino_net:
    driver: bridge
